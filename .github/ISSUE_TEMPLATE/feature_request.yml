name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 你想解决什么问题？ / What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代做法 / Current workaround
