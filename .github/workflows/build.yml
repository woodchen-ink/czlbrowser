name: Build Windows Installer

# 每次 push 到 main / master 自动构建 Windows 安装包并发布 Release。
# 仅 Windows：代理运行时 (xray/sing-box)、NSIS、WebView2 均为 Windows-only，
# 其它平台无法产出可用安装包。安装包不含 chrome 内核（被 gitignore，CI 拿不到），
# 用户安装后自备内核——与项目"内核用户自备"模式一致。
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          'placeholder' | Out-File -FilePath frontend/dist/__wails_placeholder__.txt -Encoding utf8
          wails generate module
          if (Test-Path frontend/wailsjs) {
            Copy-Item -Recurse -Force frontend/wailsjs/* frontend/src/wailsjs/
          }
          Remove-Item -Recurse -Force frontend/dist

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # 日期按 UTC+8（东八区）计算，与本地一致，避免 runner UTC 差一天。
          $date = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'China Standard Time')
          $datePart = $date.ToString('yyyy.MM.dd')
          # tag = 日期 + run_number，保证同一天多次构建不撞 tag，每次产生新历史 Release。
          $full = "$datePart.$($env:GITHUB_RUN_NUMBER)"
          $tag = "v$full"
          # asset 文件名固定，无论走日期 tag 还是 latest，下载文件名都一致。
          "fullVersion=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assetName=CZLBrowser-Setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $full  Tag: $tag  Asset: CZLBrowser-Setup.exe"

      - name: Wails build
        run: wails build -platform windows/amd64 -trimpath

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/czl-browser.exe')) {
            throw 'Build output missing: build/bin/czl-browser.exe'
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Assemble staging (no chrome kernel)
        shell: pwsh
        run: |
          $staging = 'publish/staging'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item 'build/bin/czl-browser.exe' "$staging/czl-browser.exe" -Force

          if (Test-Path 'publish/config.init.yaml') {
            Copy-Item 'publish/config.init.yaml' "$staging/config.yaml" -Force
          } else {
            throw 'Missing publish/config.init.yaml'
          }

          New-Item -ItemType Directory -Force -Path "$staging/bin" | Out-Null
          foreach ($f in 'xray.exe','sing-box.exe') {
            if (-not (Test-Path "bin/$f")) { throw "Missing runtime: bin/$f" }
            Copy-Item "bin/$f" "$staging/bin/$f" -Force
          }

          New-Item -ItemType Directory -Force -Path "$staging/data" | Out-Null
          Write-Host 'Staging assembled (chrome kernel intentionally excluded).'

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'publish/output' | Out-Null
          # installer.nsi 要求 UTF-8 with BOM（Unicode True）。
          $nsi = (Resolve-Path 'publish/installer.nsi').Path
          $c = [System.IO.File]::ReadAllText($nsi, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText($nsi, $c, [System.Text.UTF8Encoding]::new($true))

          # choco 安装的 makensis 不在当前会话 PATH，按常见安装路径定位。
          $makensis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) { throw 'makensis.exe not found after NSIS install' }

          $staging = (Resolve-Path 'publish/staging').Path
          $ver = '${{ steps.version.outputs.fullVersion }}'
          & $makensis "/DVERSION=$ver" "/DSTAGINGDIR=$staging" 'publish/installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit $LASTEXITCODE" }

          # NSIS 内部按版本号命名，重命名为固定 asset 名以稳定下载路径。
          $built = "publish/output/CZLBrowser-Setup-$ver.exe"
          if (-not (Test-Path $built)) { throw "Installer not found: $built" }
          $final = 'publish/output/${{ steps.version.outputs.assetName }}'
          Move-Item -Force $built $final
          Write-Host "Installer: $final"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: CZLBrowser-Setup-${{ steps.version.outputs.fullVersion }}
          path: publish/output/${{ steps.version.outputs.assetName }}
          retention-days: 90
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          # 固定 tag=latest，每次覆盖同一 Release 与同名 asset，
          # 使 alist GitHub 发行版代理出的下载链接保持稳定。
          tag_name: ${{ steps.version.outputs.tag }}
          name: CZL Browser ${{ steps.version.outputs.fullVersion }}
          make_latest: 'true'
          body: |
            自动构建产物（Windows x64，不含 Chrome 内核，需自备内核）。

            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
          files: publish/output/${{ steps.version.outputs.assetName }}
          draft: false
          prerelease: false
