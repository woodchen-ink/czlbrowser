name: Build Windows Installer

# 每次 push 到 main / master 自动构建 Windows 安装包并发布 Release。
# 仅 Windows：代理运行时 (xray/sing-box)、NSIS、WebView2 均为 Windows-only，
# 其它平台无法产出可用安装包。安装包不含 chrome 内核（被 gitignore，CI 拿不到），
# 用户安装后自备内核——与项目"内核用户自备"模式一致。
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # 私有仓库的 Release 普通用户无法下载，安装包同步发布到公开仓库供在线更新使用
      RELEASES_REPO: woodchen-ink/czlbrowser-releases
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 客户端运行时会从 woodchen-ink/Chrome-exe 拉取最新内核清单；这里把内嵌兜底清单也刷新到最新，
      # 远程不可用或校验失败时保留仓库中的版本，不影响构建。
      - name: Refresh embedded core manifest
        shell: pwsh
        run: |
          $target = 'backend/builtin_cores.json'
          $backup = Get-Content -Raw $target
          try {
            $content = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 'https://raw.githubusercontent.com/woodchen-ink/Chrome-exe/main/cores.json').Content
            [IO.File]::WriteAllText((Resolve-Path $target), $content)
            go test ./backend/ -run '^TestBuiltinCoresManifest$' -count=1
            if ($LASTEXITCODE -ne 0) { throw '远程内核清单未通过校验' }
            Write-Host '内嵌内核清单已刷新'
          } catch {
            [IO.File]::WriteAllText((Resolve-Path $target), $backup)
            Write-Warning "内核清单刷新失败，沿用仓库版本: $_"
          }

      - name: Generate Wails bindings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          'placeholder' | Out-File -FilePath frontend/dist/__wails_placeholder__.txt -Encoding utf8
          wails generate module
          if (Test-Path frontend/wailsjs) {
            Copy-Item -Recurse -Force frontend/wailsjs/* frontend/src/wailsjs/
          }
          Remove-Item -Recurse -Force frontend/dist

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # 日期按 UTC+8（东八区）计算，与本地一致，避免 runner UTC 差一天。
          $date = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'China Standard Time')
          $datePart = $date.ToString('yyyy.MM.dd')
          # tag = 日期 + run_number，保证同一天多次构建不撞 tag，每次产生新历史 Release。
          $full = "$datePart.$($env:GITHUB_RUN_NUMBER)"
          $tag = "v$full"
          # asset 文件名带版本号，便于区分不同构建（下载文件名随版本变化）。
          $asset = "CZLBrowser-Setup-$full.exe"
          "fullVersion=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assetName=$asset"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $full  Tag: $tag  Asset: $asset"

      # 版本号编进 exe，客户端据此判断是否有新版本；本地构建保持 dev，不提示更新
      - name: Wails build
        run: wails build -platform windows/amd64 -trimpath -ldflags "-X czl-browser/backend.AppVersion=${{ steps.version.outputs.fullVersion }}"

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/czl-browser.exe')) {
            throw 'Build output missing: build/bin/czl-browser.exe'
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Assemble staging (no chrome kernel)
        shell: pwsh
        run: |
          $staging = 'publish/staging'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item 'build/bin/czl-browser.exe' "$staging/czl-browser.exe" -Force

          if (Test-Path 'publish/config.init.yaml') {
            Copy-Item 'publish/config.init.yaml' "$staging/config.yaml" -Force
          } else {
            throw 'Missing publish/config.init.yaml'
          }

          New-Item -ItemType Directory -Force -Path "$staging/bin" | Out-Null
          foreach ($f in 'xray.exe','sing-box.exe') {
            if (-not (Test-Path "bin/$f")) { throw "Missing runtime: bin/$f" }
            Copy-Item "bin/$f" "$staging/bin/$f" -Force
          }

          New-Item -ItemType Directory -Force -Path "$staging/data" | Out-Null
          Write-Host 'Staging assembled (chrome kernel intentionally excluded).'

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'publish/output' | Out-Null
          # installer.nsi 要求 UTF-8 with BOM（Unicode True）。
          $nsi = (Resolve-Path 'publish/installer.nsi').Path
          $c = [System.IO.File]::ReadAllText($nsi, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText($nsi, $c, [System.Text.UTF8Encoding]::new($true))

          # choco 安装的 makensis 不在当前会话 PATH，按常见安装路径定位。
          $makensis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) { throw 'makensis.exe not found after NSIS install' }

          $staging = (Resolve-Path 'publish/staging').Path
          $ver = '${{ steps.version.outputs.fullVersion }}'
          & $makensis "/DVERSION=$ver" "/DSTAGINGDIR=$staging" 'publish/installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit $LASTEXITCODE" }

          # NSIS 按版本号输出 CZLBrowser-Setup-<ver>.exe，即最终 asset 名，无需重命名。
          $out = "publish/output/${{ steps.version.outputs.assetName }}"
          if (-not (Test-Path $out)) { throw "Installer not found: $out" }
          Write-Host "Installer: $out"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: CZLBrowser-Setup-${{ steps.version.outputs.fullVersion }}
          path: publish/output/${{ steps.version.outputs.assetName }}
          retention-days: 90
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          # 日期 tag 每次新建历史 Release；make_latest 标记最新一个，
          # alist 通过 API 取最新 release 的 asset（asset 名随版本号变化）。
          tag_name: ${{ steps.version.outputs.tag }}
          name: CZL Browser ${{ steps.version.outputs.fullVersion }}
          make_latest: 'true'
          body: |
            自动构建产物（Windows x64，不含 Chrome 内核，需自备内核）。

            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
          files: publish/output/${{ steps.version.outputs.assetName }}
          draft: false
          prerelease: false

      # ---------------- 在线更新发布 ----------------
      # 1. 安装包发布到公开仓库 Release；2. 生成清单并用 Ed25519 私钥签名；
      # 3. latest.json 提交到公开仓库 main 分支并 purge jsDelivr。
      # 未配置 RELEASES_REPO_TOKEN 时整段跳过，不影响私有仓库的构建与发布。
      - name: Publish installer to public releases repo
        if: env.HAS_RELEASES_TOKEN == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $file = 'publish/output/${{ steps.version.outputs.assetName }}'
          gh release create $tag $file -R $env:RELEASES_REPO --title "CZL Browser ${{ steps.version.outputs.fullVersion }}" --notes "Windows x64 安装包，供应用内在线更新使用。" --latest
          if ($LASTEXITCODE -ne 0) { throw '公开仓库 Release 发布失败' }

      - name: Sign and publish update manifest
        if: env.HAS_RELEASES_TOKEN == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw '未配置 UPDATE_SIGNING_KEY，无法签名更新清单' }
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = '${{ steps.version.outputs.assetName }}'
          $file = "publish/output/$asset"

          # 更新说明：本次 push 包含的提交标题；手动触发时取 HEAD 提交标题
          $lines = @()
          try { $lines = @(($env:COMMIT_MESSAGES | ConvertFrom-Json) | Where-Object { $_ } | ForEach-Object { ($_ -split "`n")[0].Trim() }) } catch {}
          if ($lines.Count -eq 0) { $lines = @(git log -1 --pretty=%s) }
          $changelog = ($lines | ForEach-Object { "- $_" }) -join "`n"

          $urls = @("https://github.com/$($env:RELEASES_REPO)/releases/download/$tag/$asset")

          $manifest = [ordered]@{
            version      = '${{ steps.version.outputs.fullVersion }}'
            platform     = 'windows-x64'
            publishedAt  = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            changelog    = $changelog
            fileName     = $asset
            size         = (Get-Item $file).Length
            sha256       = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            downloadUrls = @($urls)
          }
          New-Item -ItemType Directory -Force -Path 'publish/update' | Out-Null
          [IO.File]::WriteAllText("$PWD/publish/update/manifest.json", ($manifest | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))

          go run ./tools/updatesign sign -in publish/update/manifest.json -out publish/update/latest.json
          if ($LASTEXITCODE -ne 0) { throw '清单签名失败' }
          # 用客户端同一套验签逻辑校验，防止私钥与内置公钥不匹配时发布出客户端无法识别的清单
          $env:UPDATE_ENVELOPE_FILE = "$PWD/publish/update/latest.json"
          go test ./backend/internal/update/ -run '^TestReleaseEnvelope$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw '清单验签失败：UPDATE_SIGNING_KEY 与内置公钥不匹配' }

          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/publish/update/latest.json"))
          $sha = gh api "repos/$($env:RELEASES_REPO)/contents/latest.json?ref=main" --jq .sha 2>$null
          $hasFile = ($LASTEXITCODE -eq 0) -and $sha
          $ghArgs = @('api', '-X', 'PUT', "repos/$($env:RELEASES_REPO)/contents/latest.json",
            '-f', "message=release: $tag", '-f', "content=$content", '-f', 'branch=main')
          if ($hasFile) { $ghArgs += @('-f', "sha=$sha") }
          gh @ghArgs | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'latest.json 提交失败' }

          try {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 "https://purge.jsdelivr.net/gh/$($env:RELEASES_REPO)@main/latest.json" | Out-Null
          } catch { Write-Warning "jsDelivr purge 失败: $_" }
          Write-Host "更新清单已发布: $tag"
